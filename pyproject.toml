[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psxsec"
version = "1.0.0"
description = "PSX sector risk and return: which sectors paid best for the risk over five years"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "matplotlib>=3.9", "yfinance>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "nbformat>=5.9"]
notebook = ["nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]

[project.scripts]
psxsec = "psxsec.__main__:main"

[tool.setuptools.packages.find]
include = ["psxsec*"]

[tool.setuptools.package-data]
psxsec = ["templates/*", "templates/docs/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]            # the package sits at the repository root, so plain `pytest` can import it without an install
filterwarnings = ["ignore::FutureWarning", "ignore::RuntimeWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]
